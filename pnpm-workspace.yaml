# pnpm の supply-chain policy 用設定。
# 新規公開から24時間は依存を解決せず、サプライチェーン攻撃の検知期間を確保する。
# 既存の lockfile を安全に再現できる最小の保留期間を採用する。
minimumReleaseAge: 1440

# minimumReleaseAgeExclude は「公開直後のため既定では保留される版」を明示的に許可する。
minimumReleaseAgeExclude:
  - '@types/three@0.186.0'

# 解決済みパッケージの provenance / signature が更新時に弱くなることを拒否する。
trustPolicy: no-downgrade

# allowBuilds は依存の install 時 build script 実行可否を明示する。
# pnpm 11 では未指定の build script を黙って無視せず、明示が無いと
# install が失敗する。以下はいずれもプラットフォーム別 optionalDependencies
# でバイナリを配布しており、build script を実行しなくても動作するため false とする。
# lefthook: node_modules/.bin/lefthook が optionalDependencies のバイナリで動作する。
# esbuild / workerd: wrangler が依存する。どちらも @esbuild/* @cloudflare/workerd-* を
#   optionalDependencies として同梱しており、postinstall 無しで deploy / versions upload が動く。
allowBuilds:
  esbuild: false
  lefthook: false
  workerd: false
